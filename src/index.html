<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Experience M-Golf, a fun browser-based golf game with realistic drives and pitches. Skip the average mini golf. Play for free now!"
    />
    <title>M-Golf</title>
    <!--FlatIcon Author: https://www.flaticon.com/authors/ylivdesign-->
    <link rel="icon" type="image/png" href="/golf-svgrepo-com.png" />
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <script type="module" src="./main.ts"></script>
    <div class="overlay">
      <div class="overlay-content">
        <div class="overlay-text-container">
          <h1 class="title"></h1>
          <p class="par"></p>
          <p class="strokes"></p>
          <p class="score"></p>
          <p class="total-strokes"></p>
          <p class="total-score"></p>
        </div>
        <div class="overlay-btns-container">
          <button class="play">Play</button>
          <button class="next">Next Hole</button>
          <button class="replay">Replay Hole</button>
          <button class="play-again">Play Again</button>
        </div>
      </div>
    </div>
    <div class="hud">
      <div class="top-input-container">
        <div class="reset-container">
          <button id="input-reset"></button>
          <span id="reset-hole-text">Reset Hole</span>
        </div>
        <div class="aim-sensitivity-container">
          <input
            id="aim-sensitivity-switch"
            class="switch"
            type="checkbox"
            autocomplete="off"
          />
          <span id="aim-sensitivity-mode">Slow Aim</span>
        </div>
      </div>
      <div class="slider-container">
        <div class="input-container">
          <div class="input-card">
            <button
              id="input-left"
              aria-label="Aim Shot Left"
              class="input-btn input-rotate-left"
            >
              <span>&larr;</span>
            </button>
            <button
              id="input-shoot"
              aria-label="Shoot Ball"
              class="input-btn input-shoot"
            ></button>
            <button
              id="input-right"
              aria-label="Aim Shot Right"
              class="input-btn input-rotate-right"
            >
              <span>&rarr;</span>
            </button>
          </div>
        </div>
        <label for="pow">Swing Power</label>
        <div class="slider-card">
          <input
            name="pow"
            type="range"
            class="slider"
            id="xz-linvel-f"
            max="5"
            min="0.1"
            step="0.1"
            value="2.5"
            list="markers"
          />
        </div>
      </div>
      <div class="slider-container vertical">
        <label for="chip">Chip<br />Power</label>
        <div class="slider-card">
          <input
            name="chip"
            type="range"
            class="slider"
            id="y-linvel-f"
            max="2.5"
            min="0"
            step="0.1"
            value="0"
          />
        </div>
      </div>
    </div>
  </body>
</html>
