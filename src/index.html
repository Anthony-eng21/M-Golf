<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M-Golf</title>
    <!--FlatIcon Author: https://www.flaticon.com/authors/ylivdesign-->
    <link rel="icon" type="image/png" href="/golf-svgrepo-com.png" />
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <script type="module" src="./main.ts"></script>
    <div class="overlay">
      <div class="overlay-content">
        <div class="overlay-text-container">
          <h1 class="title"></h1>
          <p class="par"></p>
          <p class="strokes"></p>
          <p class="score"></p>
          <p class="total-strokes"></p>
          <p class="total-score"></p>
        </div>
        <div class="overlay-btns-container">
          <button class="play">Play</button>
          <button class="next">Next Hole</button>
          <button class="replay">Replay Hole</button>
          <button class="play-again">Play Again</button>
        </div>
      </div>
    </div>
    <div class="hud">
      <div class="slider-container">
        <div class="mobile-input-container">
          <div class="mobile-input-card">
            <button
              id="mobile-left"
              aria-label="Aim Shot Left"
              class="mobile-input-btn input-rotate-left"
            >
              <span>&larr;</span>
            </button>
            <button
              id="mobile-shoot"
              aria-label="Shoot Ball"
              class="mobile-input-btn input-shoot"
            ></button>
            <button
              id="mobile-right"
              aria-label="Aim Shot Right"
              class="mobile-input-btn input-rotate-right"
            >
              <span>&rarr;</span>
            </button>
          </div>
        </div>
        <div class="slider-card">
          <input
            type="range"
            class="slider"
            id="xz-linvel-f"
            max="5"
            min="0.1"
            step="0.1"
            value="2.5"
            list="markers"
          />
        </div>
      </div>
      <div class="slider-container vertical">
        <div class="slider-card">
          <input
            type="range"
            class="slider"
            id="y-linvel-f"
            max="2.5"
            min="0"
            step="0.1"
            value="0"
          />
        </div>
      </div>
    </div>
  </body>
</html>
